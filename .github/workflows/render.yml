name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: '项目目录名，如 2026-10-16-32bit-ms-timer'
        required: true
        type: string
      scale:
        description: '分辨率：1 = 1080p，2 = 4K'
        default: '2'
        type: string
      segments:
        description: '并行段数（1–20，不足时按总帧数缩减）'
        default: '10'
        type: string
      to:
        description: '只渲染前 N 秒（留空为整片）'
        required: false
        type: string

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      name: ${{ steps.prepare.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sensitive word check
        env:
          PROJECT: ${{ inputs.project }}
          SENSITIVE_WORDS: ${{ secrets.SENSITIVE_WORDS }}
        run: node tools/render/ci/pipeline.mjs check "$PROJECT"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix tools/render --ignore-scripts --no-audit --no-fund
          python3 -m pip install numpy scipy
      - name: Prepare timeline, audio and matrix
        id: prepare
        env:
          PROJECT: ${{ inputs.project }}
          SCALE: ${{ inputs.scale }}
          SEGMENTS: ${{ inputs.segments }}
          TO: ${{ inputs.to }}
        run: node tools/render/ci/pipeline.mjs prepare "$PROJECT" "$RUNNER_TEMP/prepared" "$SCALE" "$SEGMENTS" "$TO"
      - uses: actions/upload-artifact@v4
        with:
          name: render-prepared
          path: |
            ${{ runner.temp }}/prepared/plan.json
            ${{ runner.temp }}/prepared/timeline.json
            ${{ runner.temp }}/prepared/audio.wav
          if-no-files-found: error
          retention-days: 1

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix tools/render --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: render-prepared
          path: ${{ runner.temp }}/prepared
      - name: Render segment
        env:
          SEGMENT_ID: ${{ matrix.id }}
        run: node tools/render/ci/pipeline.mjs render "$RUNNER_TEMP/prepared/plan.json" "$SEGMENT_ID" "$RUNNER_TEMP/parts"
      - uses: actions/upload-artifact@v4
        with:
          name: render-part-${{ matrix.id }}
          path: ${{ runner.temp }}/parts/part-${{ matrix.id }}.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: render-prepared
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: render-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/parts
      - name: Assemble, verify and preview
        run: node tools/render/ci/pipeline.mjs assemble "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/parts" "$RUNNER_TEMP/final"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.name }}-scale-${{ inputs.scale }}
          path: ${{ runner.temp }}/final/*.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.name }}-preview
          path: |
            ${{ runner.temp }}/final/sheet_*.jpg
            ${{ runner.temp }}/final/timeline.json
          if-no-files-found: error
          retention-days: 7
